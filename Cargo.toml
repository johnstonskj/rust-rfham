[workspace]
resolver = "3"

members = [
    "rfham",
    "rfham-antennas",
    "rfham-bands",
    "rfham-cli",
    "rfham-config",
    "rfham-core",
    "rfham-geo",
    "rfham-iri",
    "rfham-itu",
    "rfham-maidenhead",
    "rfham-markdown",
    "rfham-qsolog",
    "rfham-rigs",
    "rfham-rigs/examples/elecraft-query",
    "rfham-services",
]

[workspace.package]
edition = "2024"
authors = ["Simon Johnston <johnstonskj@gmail.com"]
repository = "https://github.com/johnstonskj/rust-rfham"
homepage = "https://simonkjohnston.life/rust-rfham"
license = "MIT OR Apache-2.0"
keywords = ["ham", "radio"]

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
    "alloc",
    "clock",
    "now",
] }
colored = { version = "3.1" }
document-features = "0.2"
language-tags = { version = "0.3", features = ["serde"] }
lat-long = { version = "0.1", features = [
    "serde",
], path = "../rust-lat-long/" }
num = { version = "0.4" }
num-rational = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
regex = { version = "1.12", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_with = { version = "3.18", default-features = false, features = [
    "alloc",
    "macros",
] }
serialport = { version = "4.9.0", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = { version = "2.0", default-features = false }
toml = { version = "1.1", features = ["serde"] }
tracing = "0.1"
uom = { version = "0.38", default-features = false, features = [
    "autoconvert",
    "f64",
    "serde",
    "si",
] }
url = { version = "2.5", default-features = false, features = ["serde"] }

[workspace.lints.rust]
exported_private_dependencies = "deny"
anonymous_parameters = "deny"
bare_trait_objects = "deny"
deref_nullptr = "deny"
drop_bounds = "deny"
dyn_drop = "deny"
ellipsis_inclusive_range_patterns = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "forbid"

absolute_paths_not_starting_with_crate = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
future_incompatible = { level = "warn", priority = -1 }
macro_use_extern_crate = "warn"
missing_debug_implementations = "warn"
nonstandard_style = { level = "warn", priority = -1 }
noop_method_call = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = "warn"
unreachable_pub = "warn"
unused = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
all = "warn"

[package]
name = "rfham-antennas"
description = "Data types to represent antennas."
version = "0.1.1"
readme = "README.md"
publish = true

edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
features = ["std"]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.playground]
features = ["std"]

[features]
default = ["std"]
std = ["colored"]
no-color = ["std", "colored/no-color"]

[dependencies]
rfham-bands = { version = "0.1", path = "../rfham-bands" }
rfham-core = { version = "0.1", path = "../rfham-core" }
rfham-itu = { version = "0.1", path = "../rfham-itu" }
rfham-markdown = { version = "0.1", path = "../rfham-markdown" }
uom = { version = "0.38", default-features = false, features = [
    "autoconvert",
    "f64",
    "serde",
    "si",
] }
colored = { version = "3.1", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies.wasm-bindgen-test]
version = "0.3"

[lints]
workspace = true

[package]
name = "rfham-config"
description = "Shared configuration data for RF-Ham libraries and tools."
version = "0.1.1"
readme = "README.md"
publish = true

edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
language-tags = { version = "0.3", features = ["serde"] }
rfham-bands = { version = "0.1.1", path = "../rfham-bands" }
rfham-core = { version = "0.1.1", path = "../rfham-core" }
rfham-geo = { version = "0.1.1", path = "../rfham-geo" }
rfham-itu = { version = "0.1.2", path = "../rfham-itu" }
rfham-maidenhead = { version = "0.1.0", path = "../rfham-maidenhead" }
rfham-markdown = { version = "0.1.1", path = "../rfham-markdown" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_with = { version = "3.18", default-features = false, features = [
    "alloc",
    "macros",
] }
serialport = { version = "4.9.0", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = { version = "2.0", default-features = false }
toml = "1.1"
tracing = "0.1"
xdirs = "0.1"

[dev-dependencies]
pretty_assertions = "1.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies.wasm-bindgen-test]
version = "0.3"

[lints]
workspace = true

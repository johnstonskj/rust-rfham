[package]
name = "rfham-core"
description = "Core data types for RF-Ham libraries."
version = "0.1.1"
readme = "README.md"
publish = true

edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
features = ["std"]
rustdoc-args = [
    "--generate-link-to-definition",
    "--html-in-header",
    "rustdoc/header.html",
]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.playground]
features = ["std"]

[features]
default = ["std"]
#! This library supports `no_std` if you set `default-features` to `false`.

## Enables the `std` library, and associated feature in dependencies.
std = [
    "num-rational/std",
    "num-traits/std",
    "regex/std",
    "serde/std",
    "serde_json/std",
    "serde_with/std",
    "thiserror/std",
    "uom/std",
    "url/std",
]

[dependencies]
document-features = "0.2"
num-rational = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
regex = { version = "1.12", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_with = { version = "3.18", default-features = false, features = [
    "alloc",
    "macros",
] }
strum = { version = "0.28", features = ["derive"] }
thiserror = { version = "2.0", default-features = false }
uom = { version = "0.38", default-features = false, features = [
    "autoconvert",
    "f64",
    "serde",
    "si",
] }
url = { version = "2.5", default-features = false, features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies.wasm-bindgen-test]
version = "0.3"

[lints]
workspace = true

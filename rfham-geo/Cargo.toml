[package]
name = "rfham-geo"
description = "Core locator data type and lookup functions for location intormation."
version = "0.1.1"
readme = "README.md"
publish = true

edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
features = ["std"]
rustdoc-args = [
    "--generate-link-to-definition",
    "--html-in-header",
    "rustdoc/header.html",
]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.playground]
features = ["std"]

[features]
default = ["std"]
std = []

[dependencies]
lat-long = { version = "0.1", features = [
    "serde",
], path = "../../rust-lat-long/" }
rfham-core = { version = "0.1.1", path = "../rfham-core" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_with = { version = "3.18", default-features = false, features = [
    "alloc",
    "macros",
] }
strum = { version = "0.28", features = ["derive"] }
thiserror = { version = "2.0", default-features = false }
tracing = "0.1.44"
uom = { version = "0.38", default-features = false, features = [
    "autoconvert",
    "f64",
    "serde",
    "si",
] }

[dev-dependencies]
pretty_assertions = "1.4"
serde_json = { version = "1.0" }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies.wasm-bindgen-test]
version = "0.3"

[lints]
workspace = true

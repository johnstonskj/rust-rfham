[package]
name = "rfham-itu"
description = "Data Types representing ITU standards underlying Ham operations."
version = "0.1.2"
readme = "README.md"
publish = true

edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
colored = { version = "3.1", optional = true }
lat-long = { version = "0.1", features = [
    "serde",
], path = "../../rust-lat-long/" }
rfham-core = { version = "0.1.1", path = "../rfham-core" }
rfham-markdown = { version = "0.1.1", path = "../rfham-markdown" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0" }
serde_with = { version = "3.18", default-features = false, features = [
    "alloc",
    "macros",
] }
strum = { version = "0.28", features = ["derive"] }
thiserror = { version = "2.0", default-features = false }
uom = { version = "0.38", default-features = false, features = [
    "autoconvert",
    "f64",
    "serde",
    "si",
] }

[dev-dependencies]
pretty_assertions = "1.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies.wasm-bindgen-test]
version = "0.3"

[lints]
workspace = true

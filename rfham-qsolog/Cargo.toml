[package]
name = "rfham-qsolog"
description = "QSO logging"
version = "0.1.0"
readme = "README.md"
publish = true

edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["adif", "sql", "std"]
adif = []
alloc = []
color = ["colored"]
sql = ["regex", "rusqlite", "std", "uuid"]
std = []

[[bin]]
name = "qso"
path = "src/bin/qso.rs"
required-features = ["color"]

[dependencies]
rfham-core = { version = "0.1.1", path = "../rfham-core" }
#rfham-geo = { version = "0.1.1", path = "../rfham-geo" }
#rfham-itu = { version = "0.1.2", path = "../rfham-itu" }
rfham-maidenhead = { version = "0.1.0", path = "../rfham-maidenhead" }

chrono = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
xdirs = { workspace = true }

colored = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rusqlite = { version = "0.40", features = [
    "backup",
    "bundled",
    "chrono",
    "functions",
    "uuid",
], optional = true }
uuid = { version = "1.26", default-features = false, features = [
    "serde",
    "v7",
], optional = true }


[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = "3.27"

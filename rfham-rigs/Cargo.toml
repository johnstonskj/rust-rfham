[package]
name = "rfham-rigs"
description = "Rig data and control"
version = "0.1.1"
readme = "README.md"
publish = true

edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["elecraft"]
elecraft = [
    "meta",
    # Transceivers
    "k3-kx",
    "k4",
    "kh1",
    # Tuners
    "kat500",
    # Amplifiers
    "kpa500",
    "kpa1500",
    "kxpa100",
    # Panadapters
    "p3",
    "px3",
]
meta = []
k3-kx = ["meta"]
k4 = ["meta"]
kat500 = []
kh1 = ["meta"]
kpa500 = []
kpa1500 = []
kxpa100 = []
p3 = []
px3 = []
icom = ["ic-705"]
ic-705 = []
kenwood = []
yaesu = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
    "alloc",
    "clock",
    "now",
] }
num = "0.4"
pastey = "0.2.3"
rfham-config = { version = "0.1.1", path = "../rfham-config" }
rfham-core = { version = "0.1.1", path = "../rfham-core" }
rfham-iri = { version = "0.1.0", path = "../rfham-iri" }
rfham-itu = { version = "0.1.2", path = "../rfham-itu" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serialport = { version = "4.9.0", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = { version = "2.0", default-features = false }
toml = { version = "1.1.3", features = ["serde"] }
tracing = "0.1.44"

[dev-dependencies]
pretty_assertions = "1.4"

[lints]
workspace = true

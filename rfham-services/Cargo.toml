[package]
name = "rfham-services"
description = "Service Abstractions for ham information."
version = "0.1.0"
readme = "README.md"
publish = true

edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
rfham-config = { version = "0.1.1", path = "../rfham-config" }
rfham-core = { version = "0.1.1", path = "../rfham-core" }
rfham-geo = { version = "0.1.0", path = "../rfham-geo" }
rfham-maidenhead = { version = "0.1.0", path = "../rfham-maidenhead" }

lat-long = { workspace = true }
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

serde-xml-rs = { version = "0.8" }
open = "5.3.5"

[dev-dependencies]
pretty_assertions = "1.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies.wasm-bindgen-test]
version = "0.3"

[lints]
workspace = true

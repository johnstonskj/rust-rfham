[package]
name = "rfham-services"
description = "Service Abstractions for ham information."
version = "0.1.0"
readme = "README.md"
publish = true

edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
lat-long = { version = "0.1", features = [
    "serde",
], path = "../../rust-lat-long/" }
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
rfham-config = { version = "0.1.1", path = "../rfham-config" }
rfham-core = { version = "0.1.1", path = "../rfham-core" }
rfham-geo = { version = "0.1.0", path = "../rfham-geo" }
rfham-maidenhead = { version = "0.1.0", path = "../rfham-maidenhead" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_with = { version = "3.18", default-features = false, features = [
    "alloc",
    "macros",
] }
serde-xml-rs = { version = "0.8" }
strum = { version = "0.28", features = ["derive"] }
thiserror = { version = "2.0", default-features = false }
tracing = "0.1"
open = "5.3.5"

[dev-dependencies]
pretty_assertions = "1.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies.wasm-bindgen-test]
version = "0.3"

[lints]
workspace = true
